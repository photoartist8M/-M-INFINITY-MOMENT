<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoArtist.M</title>
  <meta property="og:title" content="PhotoArtist.M">
  <meta property="og:url" content="https://m-infinity-moment.pages.dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #e8e4dc;
      --text-dim: #9a958c;
      --accent: #c9b8a0;
      --glow: rgba(201, 184, 160, 0.28);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0a0a0a !important;
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      line-height: 1.85;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 900;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== STAGE ===== */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* Title */
/* =========================
   BRAND LOGO
========================= */

.main-title{
    position:absolute;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:30;
    pointer-events:none;
}

.logo-title{

    font-family:'Cormorant Garamond',serif;

    font-size:clamp(2.8rem,7vw,5.6rem);

    font-weight:300;

    letter-spacing:.14em;

    margin:0;

    background:linear-gradient(
        180deg,
        #fffaf5 0%,
        #ffe8d0 18%,
        #ffd8b6 38%,
        #f8c8aa 58%,
        #e5a98d 82%,
        #bf7d67 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:

        0 0 6px rgba(255,220,190,.95),

        0 0 12px rgba(255,205,170,.8),

        0 0 22px rgba(255,190,155,.55),

        0 0 42px rgba(255,170,130,.25);

    animation:logoGlow 5s ease-in-out infinite;
}
.logo-wrap{
    position:relative;
    display:inline-block;
    overflow:hidden;
}
.logo-wrap::after{

    content:"";

    position:absolute;

    top:-20%;

    left:-45%;

    width:22%;

    height:140%;

    transform:rotate(22deg);

    background:linear-gradient(

        90deg,

        rgba(255,255,255,0),

        rgba(255,255,255,.92),

        rgba(255,240,215,.95),

        rgba(255,255,255,0)

    );

    filter:blur(2px);

    animation:logoShine 6s ease-in-out infinite;

}
.logo-sub{

    margin-top:.9rem;

    font-size:clamp(.7rem,1vw,.95rem);

    letter-spacing:.7em;

    color:#f3d4bd;

    opacity:.92;

    text-transform:uppercase;

}
    .main-title .label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.78rem;
      letter-spacing: 0.45em;
      color: var(--accent);
      opacity: 0.85;
      margin-bottom: 0.45rem;
    }
    .main-title h1 {
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      font-weight: 200;
      letter-spacing: 0.3em;
    }

    /* ===== PHOTOS ===== */
    .photos {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(1.8rem, 6vw, 4.5rem);
      z-index: 5;
      transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s ease;
    }

    .photo {
      position: relative;
      width: clamp(180px, 26vw, 320px);
      aspect-ratio: 3/4;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      transition: transform 0.8s ease, box-shadow 0.8s ease;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.88) contrast(1.05);
      transition: filter 0.8s ease, transform 1.2s ease;
    }

    .photo:hover img {
      filter: brightness(1) contrast(1.08);
      transform: scale(1.03);
    }

    .photo.child { transform: rotate(0deg); }
    .photo.adult { transform: rotate(0deg); }

    .photo .label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.65rem 0.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-align: center;
    }

    .between-glow {
      position: absolute;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,184,160,0.2) 0%, transparent 70%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 4;
      animation: breath 5s ease-in-out infinite;
    }

    @keyframes breath {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.3); }
    }

    /* ===== ENTRANCE（一番分かりやすく） ===== */
    .entrance {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .entrance-inner {
      display: inline-block;
      padding: 1.15rem 2.6rem 1.05rem;
      border: 1px solid rgba(201,184,160,0.5);
      background: rgba(12,12,12,0.6);
      backdrop-filter: blur(8px);
      border-radius: 2px;
      position: relative;
      transition: border-color 0.5s ease, background 0.5s ease, box-shadow 0.5s ease, transform 0.4s ease;
    }

    .entrance:hover .entrance-inner {
      border-color: rgba(201,184,160,0.95);
      background: rgba(18,18,18,0.8);
      box-shadow: 0 0 45px rgba(201,184,160,0.3), 0 0 90px rgba(201,184,160,0.12);
      transform: scale(1.04);
    }

    .entrance-text {
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      letter-spacing: 0.3em;
      color: var(--text);
      font-weight: 300;
    }

    .entrance-sub {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      opacity: 0.95;
    }

    /* はっきり分かるパルス */
    .entrance-inner::before {
      content: '';
      position: absolute;
      inset: -7px;
      border: 1px solid rgba(201,184,160,0.25);
      border-radius: 3px;
      animation: entrancePulse 2.6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes entrancePulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(201,184,160,0);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
        box-shadow: 0 0 35px 6px rgba(201,184,160,0.18);
      }
    }

    /* 入った後は入り口を消す */
    .stage.entered .entrance {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(24px);
    }

    /* ===== FLOATING WORDS（最初から表示） ===== */
    .float-word {
      position: absolute;
      z-index: 20;
      font-size: clamp(0.68rem, 1.2vw, 0.9rem);
      letter-spacing: 0.06em;
      color: var(--text-dim);
      background: rgba(10,10,10,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.65rem 0.9rem;
      border-radius: 2px;
      backdrop-filter: blur(6px);
      cursor: pointer;
      user-select: none;
white-space: normal;
line-height: 1.8;
max-width: 220px;
text-align: center;
      opacity: 0;
      pointer-events: auto;
      transition: color 0.4s ease, border-color 0.4s ease, background 0.4s ease, box-shadow 0.5s ease, transform 0.4s ease;
      animation: floatIn 1.1s ease forwards, drift 20s ease-in-out infinite;
    }

    .float-word:hover {
      color: var(--text);
      border-color: rgba(201,184,160,0.7);
      background: rgba(18,18,18,0.5);
      box-shadow: 0 0 35px rgba(201,184,160,0.45), 0 0 18px rgba(201,184,160,0.25);
      transform: scale(1.04) !important;
    }

    .float-word.pulse::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 3px;
      animation: softPulse 3.8s ease-in-out infinite;
      pointer-events: none;
    }

@keyframes softPulse {
  0%, 100% {
    border: 1px solid transparent;
    box-shadow: 0 0 0 rgba(201,184,160,0);
  }
  50% {
    border: 1px solid rgba(201,184,160,0.45);
    box-shadow: 
      0 0 22px rgba(201,184,160,0.35),
      0 0 45px rgba(201,184,160,0.18);
    opacity: 1;
  }
}
@keyframes logoGlow{

0%{

transform:scale(1);

filter:brightness(1);

text-shadow:

0 0 6px rgba(255,220,190,.8),

0 0 14px rgba(255,205,170,.55),

0 0 26px rgba(255,185,150,.35);

}

50%{

transform:scale(1.03);

filter:brightness(1.18);

text-shadow:

0 0 10px rgba(255,235,210,1),

0 0 22px rgba(255,210,175,.95),

0 0 42px rgba(255,190,150,.75),

0 0 75px rgba(255,170,120,.45);

}

100%{

transform:scale(1);

filter:brightness(1);

text-shadow:

0 0 6px rgba(255,220,190,.8),

0 0 14px rgba(255,205,170,.55),

0 0 26px rgba(255,185,150,.35);

}

}

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(8px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      25% { transform: translateY(-18px) translateX(8px); }
      50% { transform: translateY(-24px) translateX(-12px); }
      75% { transform: translateY(-12px) translateX(6px); }
    }

    /* 浮遊言葉の位置 - JavaScriptで動的設定 */

    /* ガイド */
    .guide {
      position: absolute;
      bottom: 4.5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.66rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      opacity: 0.5;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .guide.hide { opacity: 0 !important; }

    /* ===== EXPAND PANEL ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(5px);
    }
    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .expand-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.94);
      width: min(85vw, 580px);
      max-height: 85vh;
      overflow-y: auto;
      background: rgba(10,10,10,0.94);
      border: 1px solid rgba(201,184,160,0.2);
      border-radius: 3px;
      padding: 2.2rem 1.8rem 1.8rem;
      z-index: 110;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 24px 60px rgba(0,0,0,0.65);
    }
    .expand-panel.open {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .expand-panel .close {
      position: absolute;
      top: 0.95rem;
      right: 1.15rem;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: color 0.3s ease;
    }
    .expand-panel .close:hover { color: var(--text); }

    .expand-panel h3 {
      font-size: 0.93rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 1.2rem;
    }
    .expand-panel p {
      font-size: 0.92rem;
      line-height: 2;
      margin-bottom: 0.95rem;
    }
    .expand-panel p:last-child { margin-bottom: 0; }

    /* 入った後に写真を少し小さく */
    .stage.entered .photos {
      transform: scale(0.92);
    }

    @media (max-width: 768px) {
      .main-title {
        top: 12%;
      }
      
      .photos { gap: 0.8rem; }
      .photo { width: clamp(100px, 32vw, 140px); }
      
      .float-word { 
        font-size: 0.66rem; 
        padding: 0.5rem 0.75rem; 
      }
      
      .entrance-inner { padding: 0.9rem 1.8rem 0.85rem; }
      .entrance { bottom: 18%; }
      
      .expand-panel {
        width: min(90vw, 540px);
        max-height: 80vh;
        padding: 1.8rem 1.5rem 1.5rem;
      }
    }
@media (max-width: 480px) {
  .main-title {
    top: 8%;
  }
  
  .main-title h1 {
    font-size: 1.2rem;
    margin-bottom: 1rem;
  }

  /* ★ 写真の距離・サイズ・余白を最適化 ★ */
  .photos {
    gap: 1.2rem;        /* 写真同士の距離を広げる */
    padding: 0 1rem;    /* 左右に余白を作る（見切れ防止） */
  }

  .photo {
    width: clamp(130px, 42vw, 170px); 
    /* 42vw → 2枚並んでも見切れない絶妙サイズ
       最大170px → 存在感アップ
       最小130px → 小さすぎない */
  }

  .photo .label {
    font-size: 0.55rem;
    padding: 0.5rem 0.4rem;
  }

  /* 以下は元のまま（変更なし） */
  .float-word { 
    font-size: 0.62rem; 
    padding: 0.4rem 0.6rem; 
  }
  
  .entrance-inner { 
    padding: 0.75rem 1.4rem 0.7rem; 
  }
  
  .entrance-text {
    font-size: 0.95rem;
  }
  
  .entrance-sub {
    font-size: 0.65rem;
  }
  
  .entrance { bottom: 15%; }
  
  .guide {
    font-size: 0.58rem;
    bottom: 3%;
  }
  
  .expand-panel {
    width: min(94vw, 450px);
    max-height: 68vh;
    padding: 1.5rem 1.1rem 1.1rem;
    top: 48%;
  }
  .expand-panel h3 {
    font-size: 0.78rem;
    margin-bottom: 0.85rem;
  }
  .expand-panel p {
    font-size: 0.78rem;
    line-height: 1.8;
    margin-bottom: 0.65rem;
  }
}

  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="stage" id="stage">
    <!-- Title -->
    <div class="main-title">
      <!-- <div class="label">emotional</div> -->
    <div class="logo-wrap">
    <h1 class="logo-title">photoartist.M</h1>
</div>
<div class="logo-sub">- emotional -</div>

    <!-- Facing photos -->
    <div class="photos">
      <div class="between-glow"></div>
      <div class="photo child">
     <img src="images/IMG_0040.jpg" alt="幼い頃の私">
        <div class="label">幼い頃のわたし</div>
      </div>
      <div class="photo adult">
   <img src="images/DSC_2555.jpg" alt="大人になった私">
        <div class="label">大人になった私</div>
      </div>
    </div>

    <!-- ★ 展示空間の入り口（画面で最も目立つ） ★ -->
    <!-- <div class="entrance" id="entrance">
      <div class="entrance-inner">
        <div class="entrance-text">記憶の中へ</div>
        <div class="entrance-sub">展示空間に入る</div>
      </div>
    </div> -->

    <!-- Floating words（入ってから出現） -->
    <div class="float-word w1 pulse" data-id="1">記憶は過去を<br>保存するものではない</div>
    <div class="float-word w2 pulse" data-id="2">あの日の光は、今も心の中にある</div>
    <div class="float-word w3 pulse" data-id="3">思い出すたびに、光は強まり</div>
    <div class="float-word w4 pulse" data-id="4">写真は、過去ではない</div>
    <div class="float-word w5 pulse" data-id="5">あなた自身の記憶を<br>呼び覚ますための展示</div>
    <div class="float-word w6 pulse" data-id="6">あの日へ、もう一度</div>
    <div class="float-word w7 pulse" data-id="7">目には見えなくなったものたちが</div>
    <div class="float-word w8 pulse" data-id="8">記憶が現在に立ち現れる<br>瞬間を写したい</div>

    <div class="guide" id="guide">言葉に触れてみてください</div>
  </div>

  <!-- Overlay + Panel -->
  <div class="overlay" id="overlay"></div>
  <div class="expand-panel" id="panel">
    <button class="close" id="closeBtn">閉じる</button>
    <h3 id="panelTitle"></h3>
    <div id="panelBody"></div>
  </div>

  <script>
    const contents = {
      1: {
        title: "記憶は、過去を保存するものではない",
        body: `<p>思い出すたびに光は強まり<br>輪郭は失われ、<br>感情だけが静かに残っていく</p><p>そんな記憶の中を歩くための写真展。</p>`
      },
      2: {
        title: "あの日の光は、今も心の中にある",
        body: `<p>人物の表情はおぼろげでも<br>風の間隔や<br>夕暮れの色<br>草を踏みしめた感触<br>誰かと笑った時間</p><p>忘れたはずの景色は<br>ふとした瞬間に姿を現す。</p>`
      },
      3: {
        title: "思い出すたびに、光は強まり",
        body: `<p>輪郭は失われ、<br>感情だけが静かに残っていく。</p><p>時は流れても<br>心に残る景色は<br>ずっと瞬き続けている。</p>`
      },
      4: {
        title: "写心(写真)は、過去ではない",
        body: `<p>私は写真を撮りたいのではなく、<br>記憶が現在に立ち現れる、<br>その瞬間(写心)を写したい。</p><p>光や空気･･･<br>手を伸ばした距離。<br>笑い声の余韻･･･</p>`
      },
      5: {
        title: "あなた自身の記憶を呼び覚ますための展示",
        body: `<p>展示している作品は<br>出来事を記録したものではありません。</p><p>あなた自身の記憶を呼び覚ますための<br>小さな欠片です。</p>`
      },
      6: {
        title: "あの日へ、もう一度",
        body: `<p>もしこの展示作品で<br>あなた自身の記憶と静かに重なったなら。</p><p>その瞬間、<br>写心(写真)は過去ではなく<br>現在の感情になる。</p>`
      },
      7: {
        title: "目には見えなくなったものたちが",
        body: `<p>今も心の中で生き続けている。</p><p>この展示は一般的な写真ギャラリーではありません。<br>写真を見るためではなく、<br>自分の中にある風景を見つけるための空間です。</p>`
      },
      8: {

      }
    };

    // 浮遊言葉をランダム配置（写真を避ける）
    const floatWords = document.querySelectorAll('.float-word');
    const isMobile = window.innerWidth <= 480;
    const isTablet = window.innerWidth <= 768;
    
    // 各単語に固定の位置を設定（上部と下部で分ける）
    const positions = [
      { top: '18%', side: 'left', offset: '8%' },   // w1 - もう少し下に
      { top: '28%', side: 'right', offset: '8%' },  // w2
      { top: '38%', side: 'left', offset: '3%' },   // w3 - 写真下に被らせる
      { top: '68%', side: 'right', offset: '25%' },  // w4
      { top: '75%', side: 'left', offset: '4%' },   // w5
      { top: '82%', side: 'right', offset: '5%' },  // w6
      { top: '88%', side: 'left', offset: '3%' },   // w7
      { top: '94%', side: 'right', offset: '4%' }   // w8
    ];
    
    floatWords.forEach((word, index) => {
      const pos = positions[index];
      word.style.top = pos.top;
      if (pos.side === 'left') {
        word.style.left = pos.offset;
        word.style.right = 'auto';
      } else {
        word.style.right = pos.offset;
        word.style.left = 'auto';
      }
      // アニメーション遅延を設定
      word.style.animationDelay = `${index * 0.15}s, ${index * 0.5}s`;
    });

    const stage = document.getElementById('stage');
    const entrance = document.getElementById('entrance');
    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('panel');
    const panelTitle = document.getElementById('panelTitle');
    const panelBody = document.getElementById('panelBody');
    const closeBtn = document.getElementById('closeBtn');
    const guide = document.getElementById('guide');

    // 入り口をクリック → 展示空間へ（存在する場合のみ）
    if (entrance) {
      entrance.addEventListener('click', () => {
        stage.classList.add('entered');
      });
    }

    // 浮遊言葉をクリック → パネル展開
    document.querySelectorAll('.float-word').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const data = contents[el.dataset.id];
        if (!data) return;
        panelTitle.textContent = data.title;
        panelBody.innerHTML = data.body;
        overlay.classList.add('open');
        panel.classList.add('open');
        if (guide) guide.classList.add('hide');
      });
    });

    function closePanel() {
      overlay.classList.remove('open');
      panel.classList.remove('open');
    }
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

    // Particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [], w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 1.25 + 0.25;
        this.speedX = (Math.random() - 0.5) * 0.11;
        this.speedY = (Math.random() - 0.5) * 0.11;
        this.opacity = Math.random() * 0.32 + 0.08;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(201, 184, 160, ${this.opacity})`;
        ctx.fill();
      }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    (function animate() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
