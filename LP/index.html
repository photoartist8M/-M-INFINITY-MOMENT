<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoArtist.M</title>
  <meta property="og:title" content="PhotoArtist.M">
  <meta property="og:url" content="https://m-infinity-moment.pages.dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #e8e4dc;
      --text-dim: #9a958c;
      --accent: #c9b8a0;
      --glow: rgba(201, 184, 160, 0.28);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0a0a0a !important;
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      line-height: 1.85;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 900;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== STAGE ===== */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* Title */
    .main-title{
        position:absolute;
        top:8%;
        left:50%;
        transform:translateX(-50%);
        text-align:center;
        z-index:30;
        pointer-events:none;
    }
    @media (max-width: 768px) {
  .main-title {
    top: 8%;           
  }
}

    .logo-title{
        font-family:'Cormorant Garamond',serif;
        font-size:clamp(2.8rem,7vw,5.6rem);
        font-weight:300;
        letter-spacing:.14em;
        margin:0;
        background:linear-gradient(
            180deg,
            #fffaf5 0%,
            #ffe8d0 18%,
            #ffd8b6 38%,
            #f8c8aa 58%,
            #e5a98d 82%,
            #bf7d67 100%
        );
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        text-shadow:
            0 0 6px rgba(255,220,190,.95),
            0 0 12px rgba(255,205,170,.8),
            0 0 22px rgba(255,190,155,.55),
            0 0 42px rgba(255,170,130,.25);
        animation:logoGlow 5s ease-in-out infinite;
        position:relative;
        display:inline-block;
        overflow:visible;
    }
    
    .logo-wrap{
        position:relative;
        display:inline-block;
        overflow:visible;
    }
    .logo-sub{
        margin-top:.9rem;
        font-size:clamp(.7rem,1vw,.95rem);
        letter-spacing:.7em;
        color:#f3d4bd;
        opacity:.92;
        text-transform:uppercase;
        display:none; 
    }
    .main-title .label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.78rem;
      letter-spacing: 0.45em;
      color: var(--accent);
      opacity: 0.85;
      margin-bottom: 0.45rem;
    }
    .main-title h1 {
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      font-weight: 200;
      letter-spacing: 0.3em;
    }

   /* ===== PHOTOS ===== */
.photos {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;

  gap: clamp(1.8rem, 6vw, 5rem);

  width: 100%;
  max-width: 900px;
  margin: 0 auto;

  /* photoartist.Mとの距離 */
  margin-top: -1.2rem;

  z-index: 5;

  transition:
    transform 1s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.8s ease;
}

.photo {
  position: relative;
  width: clamp(180px, 28vw, 380px);
  aspect-ratio: 3 / 4;
  border-radius: 2px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  transition: transform 0.8s ease, box-shadow 0.8s ease;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: brightness(0.88) contrast(1.05);
  transition: filter 0.8s ease, transform 1.2s ease;
}

.photo:hover img {
  filter: brightness(1) contrast(1.08);
  transform: scale(1.03);
}

.photo.child { transform: rotate(0deg); }
.photo.adult { transform: rotate(0deg); }

.photo .label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 0.65rem 0.5rem;
  background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  text-align: center;
}

.between-glow {
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(201,184,160,0.2) 0%, transparent 70%);
  filter: blur(8px);
  pointer-events: none;
  z-index: 4;
  animation: breath 5s ease-in-out infinite;
}
    @keyframes breath {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.3); }
    }

    /* ===== ENTRANCE ===== */
    .entrance {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .entrance-inner {
      display: inline-block;
      padding: 1.15rem 2.6rem 1.05rem;
      border: 1px solid rgba(201,184,160,0.5);
      background: rgba(12,12,12,0.6);
      backdrop-filter: blur(8px);
      border-radius: 2px;
      position: relative;
      transition: border-color 0.5s ease, background 0.5s ease, box-shadow 0.5s ease, transform 0.4s ease;
    }

    .entrance:hover .entrance-inner {
      border-color: rgba(201,184,160,0.95);
      background: rgba(18,18,18,0.8);
      box-shadow: 0 0 45px rgba(201,184,160,0.3), 0 0 90px rgba(201,184,160,0.12);
      transform: scale(1.04);
    }

    .entrance-text {
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      letter-spacing: 0.3em;
      color: var(--text);
      font-weight: 300;
    }

    .entrance-sub {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      opacity: 0.95;
    }

    .entrance-inner::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,184,160,0.3) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      animation: pulse-ring 2s ease-out infinite;
    }

    @keyframes pulse-ring {
      0% { width: 0; height: 0; opacity: 0.8; }
      100% { width: 100px; height: 100px; opacity: 0; }
    }

    /* ===== BACK TO EXHIBITION BUTTON ===== */
    .back-btn {
      position: fixed;
      bottom: 2.5%;
      right: 2.5%;
      padding: 0.9rem 1.8rem;
      border: 1px solid rgba(201, 184, 160, 0.5);
      background: rgba(12, 12, 12, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 2px;
      color: var(--text);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      z-index: 25;
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
    }

    .back-btn:hover {
      border-color: rgba(201, 184, 160, 0.95);
      background: rgba(18, 18, 18, 0.8);
      box-shadow: 0 0 30px rgba(201, 184, 160, 0.25);
      transform: scale(1.05);
    }

    /* ===== FLOAT WORDS ===== */
    .float-word {
      position: fixed;
      padding: 0.65rem 1rem;
      background: rgba(12,12,12,0.5);
      border: 1px solid rgba(201,184,160,0.3);
      border-radius: 2px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(6px);
      opacity: 0;
      transform: translateY(8px);
      animation: float-in 1.2s ease-out forwards, float-bob 4s ease-in-out infinite;
      transition: all 0.4s ease;
      line-height: 1.6;
      max-width: 220px;
      z-index: 10;
    }

    .float-word:hover {
      border-color: rgba(201,184,160,0.8);
      background: rgba(18,18,18,0.75);
      transform: translateY(0px) scale(1.05);
      box-shadow: 0 0 20px rgba(201,184,160,0.25);
    }

    @keyframes float-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float-bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .float-word.pulse {
      animation: float-in 1.2s ease-out forwards, pulse-glow 2.8s ease-in-out infinite, float-bob 4s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(201,184,160,0); }
      50% { box-shadow: 0 0 20px rgba(201,184,160,0.3); }
    }

    /* ===== GUIDE ===== */
    .guide {
      position: fixed;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      opacity: 0.65;
      pointer-events: none;
      z-index: 8;
      transition: opacity 0.6s ease;
    }

    .guide.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== OVERLAY & PANEL ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: opacity 0.5s ease;
      backdrop-filter: blur(2px);
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .expand-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: min(85vw, 600px);
      max-height: 85vh;
      background: linear-gradient(135deg, rgba(18,18,18,0.95) 0%, rgba(24,24,24,0.95) 100%);
      border: 1px solid rgba(201,184,160,0.25);
      border-radius: 4px;
      padding: 2rem 2.2rem;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }

    .expand-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .expand-panel h3 {
      font-size: 1.3rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      margin-bottom: 1.2rem;
      color: var(--text);
    }

    .expand-panel p {
      font-size: 0.95rem;
      line-height: 1.85;
      margin-bottom: 1rem;
      color: var(--text-dim);
    }

    .close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 32px;
      height: 32px;
      background: rgba(201,184,160,0.15);
      border: 1px solid rgba(201,184,160,0.4);
      color: var(--text);
      font-size: 18px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .close:hover {
      background: rgba(201,184,160,0.25);
      border-color: rgba(201,184,160,0.8);
      transform: scale(1.1);
    }

    .close::before {
      content: '×';
      position: absolute;
    }

    /* ===== SCROLL BAR ===== */
    .expand-panel::-webkit-scrollbar {
      width: 6px;
    }

    .expand-panel::-webkit-scrollbar-track {
      background: rgba(201,184,160,0.08);
      border-radius: 3px;
    }

    .expand-panel::-webkit-scrollbar-thumb {
      background: rgba(201,184,160,0.25);
      border-radius: 3px;
    }

    .expand-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(201,184,160,0.4);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes logoGlow {
      0%, 100% { text-shadow: 0 0 6px rgba(255,220,190,.95), 0 0 12px rgba(255,205,170,.8), 0 0 22px rgba(255,190,155,.55), 0 0 42px rgba(255,170,130,.25); }
      50% { text-shadow: 0 0 8px rgba(255,220,190,1), 0 0 16px rgba(255,205,170,.9), 0 0 28px rgba(255,190,155,.65), 0 0 50px rgba(255,170,130,.35); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .main-title { top: 10%; }
      .photos { gap: clamp(1.2rem, 4vw, 3.5rem); margin-top: 2rem; }
      .photo { width: clamp(160px, 26vw, 350px); }
      .back-btn { bottom: 2%; right: 2%; }
    }

    @media (max-width: 768px) {
      .main-title { top: 10%; }
      .photos { gap: 1rem; margin-top: 2rem; }
      .photo { width: clamp(110px, 32vw, 160px); }
      .float-word { font-size: 0.65rem; padding: 0.5rem 0.75rem; max-width: 180px; }
      .entrance-inner { padding: 0.9rem 1.8rem 0.85rem; }
      .expand-panel {
        width: min(90vw, 540px);
        max-height: 80vh;
        padding: 1.8rem 1.5rem 1.5rem;
      }
      .back-btn { padding: 0.8rem 1.5rem; font-size: 0.8rem; }
    }

    @media (max-width: 480px) {
      .main-title { top: 10%; width: 100%; max-width: 100vw; }
      .logo-title { font-size: clamp(1.8rem, 6vw, 2.8rem); margin: 0; }
      .logo-sub { margin-top: 0.4rem; font-size: clamp(0.6rem, 0.8vw, 0.8rem); }
      
      .photos {
        gap: 1.2rem;
        padding: 0 0.8rem;
        margin-top: -9rem;
        width: 100%;
        justify-content: center;
      }
      
      .photo { width: clamp(120px, 38vw, 160px); min-width: 120px; }
      .photo .label { font-size: 0.5rem; padding: 0.4rem 0.3rem; }
      .between-glow { width: 50px; height: 50px; }
      
      .float-word {
        font-size: 0.55rem;
        padding: 0.35rem 0.5rem;
        max-width: 140px;
        line-height: 1.5;
      }
      
      .entrance-inner { padding: 0.7rem 1.2rem 0.65rem; }
      .entrance-text { font-size: 0.85rem; }
      .entrance-sub { font-size: 0.58rem; margin-top: 0.3rem; }
      .entrance { bottom: 12%; }
      
      .guide { font-size: 0.52rem; bottom: 2%; }
      
      .expand-panel {
        width: min(92vw, 400px);
        max-height: 70vh;
        padding: 1.3rem 1rem 1rem;
        top: 50%;
      }
      
      .expand-panel h3 { font-size: 0.9rem; margin-bottom: 0.7rem; }
      .expand-panel p { font-size: 0.75rem; line-height: 1.6; margin-bottom: 0.5rem; }
      
      .close { width: 26px; height: 26px; font-size: 15px; top: 1rem; right: 1rem; }
      
      .back-btn {
        bottom: 1.8%;
        right: 1.8%;
        padding: 0.7rem 1.2rem;
        font-size: 0.75rem;
      }
    }

    @media (max-width: 375px) {
      .main-title { top: 10%; width: 100%; max-width: 100vw; }
      .logo-title { font-size: clamp(1.6rem, 5vw, 2.2rem); margin: 0; }
      .logo-sub { margin-top: 0.4rem; font-size: clamp(0.5rem, 0.7vw, 0.7rem); }
      
      .photos {
        gap: 1.2rem;
        padding: 0 0.8rem;
        margin-top: -5rem;
        width: 100%;
        justify-content: center;
      }
      
      .photo { width: clamp(120px, 38vw, 160px); min-width: 120px; }
      .photo .label { font-size: 0.5rem; padding: 0.4rem 0.3rem; }
      .between-glow { width: 50px; height: 50px; }
      
      .float-word {
        font-size: 0.55rem;
        padding: 0.35rem 0.5rem;
        max-width: 140px;
        line-height: 1.5;
      }
      
      .entrance-inner { padding: 0.7rem 1.2rem 0.65rem; }
      .entrance-text { font-size: 0.85rem; }
      .entrance-sub { font-size: 0.58rem; margin-top: 0.3rem; }
      .entrance { bottom: 12%; }
      
      .guide { font-size: 0.52rem; bottom: 2%; }
      
      .expand-panel {
        width: min(92vw, 400px);
        max-height: 70vh;
        padding: 1.3rem 1rem 1rem;
        top: 50%;
      }
      
      .expand-panel h3 { font-size: 0.9rem; margin-bottom: 0.7rem; }
      .expand-panel p { font-size: 0.75rem; line-height: 1.6; margin-bottom: 0.5rem; }
      
      .close { width: 26px; height: 26px; font-size: 15px; top: 1rem; right: 1rem; }
      
      .back-btn {
        bottom: 1.8%;
        right: 1.8%;
        padding: 0.65rem 1rem;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="stage" id="stage">
    <!-- Title -->
    <div class="main-title">
      <div class="logo-wrap">
        <h1 class="logo-title">photoartist.M</h1>
      </div>
      <div class="logo-sub">- emotional -</div>
</div> 
      <!-- Facing photos -->
      <div class="photos">
        <div class="between-glow"></div>
        <div class="photo child">
          <img src="images/IMG_0040.jpg" alt="幼い頃の私">
          <div class="label">幼い頃のわたし</div>
        </div>
        <div class="photo adult">
          <img src="images/DSC_2555.jpg" alt="大人になった私">
          <div class="label">大人になった私</div>
        </div>
      </div>
    </div>

    <!-- Floating words -->
    <div class="float-word w1 pulse" data-id="1">記憶は過去を<br>保存するものではない</div>
    <div class="float-word w2 pulse" data-id="2">あの日の光は、今も心の中にある</div>
    <div class="float-word w3 pulse" data-id="3">写真ではなく、写心</div>
    <div class="float-word w4 pulse" data-id="4">写真は、答えではない</div>
    <div class="float-word w5 pulse" data-id="5">あなたの中に眠る風景へ</div>
    <div class="float-word w6 pulse" data-id="6">あの日へ、もう一度</div>
  
    <div class="float-word w8 pulse" data-id="8">記憶が現在に立ち現れる<br>瞬間を写したい</div>

    <!-- Back to Exhibition Button -->
    <button class="back-btn" id="backBtn">展示へ戻る</button>

    <div class="guide" id="guide">言葉に触れてみてください</div>
  </div>

  <!-- Overlay + Panel -->
  <div class="overlay" id="overlay"></div>
  <div class="expand-panel" id="panel">
    <button class="close" id="closeBtn"></button>
    <h3 id="panelTitle"></h3>
    <div id="panelBody"></div>
  </div>

  <script>
    const contents = {
      1: {
        title: "記憶は、過去を保存するものではない",
        body: `<p>思い出は、時が止まったまま残るものではありません。</p>
               <p>思い返すたびに少しずつ姿を変え、<br>
               感情とともに、今という時間の中で生まれ変わっていきます。</p>
               <p>この展示は、そんな記憶の中を歩くための空間です。</p>`
      },
      2: {
        title: "あの日の光は、今も心の中にある",
        body: `<p>人物の表情はおぼろげになっても<br>
               夕暮れの色や風の匂い、<br>
               誰かと笑った感情は、不思議と心に残り続けます。</p>
               <p>写真は、その光をもう一度思い出すためのきっかけです。</p>`
      },
      3: {
        title: "写真ではなく、写心。",
        body: `<p>私が写したいのは、<br>
               目の前にある事実ではありません。</p>
               <p>その場所に流れていた空気、<br>
               光、静けさ、そして心の動き。</p>
               <p>写真ではなく、<br>
               心に映った風景を残したい。</p>`
      },
      4: {
        title: "写真は、答えではない",
        body: `<p>一枚の写真に、正しい見方はありません。</p>
               <p>見る人それぞれの記憶や感情と重なったとき<br>
               初めてその写真は、新しい意味を持ちはじめます。</p>`
      },
      5: {
        title: "あなた自身の記憶を呼び覚ますための展示",
        body: `<p>展示している作品は、<br>
               出来事を記録したものではありません。</p>
               <p>あなた自身の記憶や感情を呼び覚ますための<br>
               小さな欠片です。</p>`
      },
      6: {
        title: "あの日へ、もう一度",
        body: `<p>もしこの展示作品が、<br>
               あなた自身の記憶と静かに重なったなら。</p>
               <p>その瞬間、<br>
               写真は過去ではなく<br>
               現在の感情になる。</p>`
      },

    };

    // 浮遊言葉をランダム配置
    const floatWords = document.querySelectorAll('.float-word');
const positions = [
  { top: '20%', side: 'left',  offset: '16%' }, // 記憶は過去
  //{ top: '76%', side: 'left', offset: '8%' }, // 言葉に
  { top: '23%', side: 'right',  offset: '12%' }, // あの日の光は
  { top: '89%', side: 'left', offset: '18%' }, // 写真ではなく写心
  { top: '55%', side: 'left',  offset: '39%' }, // 写真は答えではない
  { top: '36%', side: 'right', offset: '65%' }, // あなたの中に眠る
  { top: '75%', side: 'left',  offset: '12%' }, //あの日へ
  { top: '80%', side: 'right', offset: '20%' } //記憶が現在に
    ];
    
    floatWords.forEach((word, index) => {
      const pos = positions[index];
      word.style.top = pos.top;
      if (pos.side === 'left') {
        word.style.left = pos.offset;
        word.style.right = 'auto';
      } else {
        word.style.right = pos.offset;
        word.style.left = 'auto';
      }
      word.style.animationDelay = `${index * 0.15}s, ${index * 0.5}s`;
    });

    const stage = document.getElementById('stage');
    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('panel');
    const panelTitle = document.getElementById('panelTitle');
    const panelBody = document.getElementById('panelBody');
    const closeBtn = document.getElementById('closeBtn');
    const guide = document.getElementById('guide');
    const backBtn = document.getElementById('backBtn');

    // 浮遊言葉をクリック → パネル展開
    document.querySelectorAll('.float-word').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const data = contents[el.dataset.id];
        if (!data || !data.title) return;
        panelTitle.textContent = data.title;
        panelBody.innerHTML = data.body;
        overlay.classList.add('open');
        panel.classList.add('open');
        if (guide) guide.classList.add('hide');
      });
    });

    function closePanel() {
      overlay.classList.remove('open');
      panel.classList.remove('open');
      if (guide) guide.classList.remove('hide');
    }
    
    closeBtn.addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

    // 展示へ戻るボタン
backBtn.addEventListener('click', () => {
  window.history.back();
});

    // Particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [], w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 1.25 + 0.25;
        this.speedX = (Math.random() - 0.5) * 0.11;
        this.speedY = (Math.random() - 0.5) * 0.11;
        this.opacity = Math.random() * 0.32 + 0.08;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(201, 184, 160, ${this.opacity})`;
        ctx.fill();
      }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    (function animate() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
