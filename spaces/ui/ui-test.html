<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>emotional - 時の瞬き</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./openingUI.css">

    <!-- 高級感のある英字フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<div id="opening">

    <div class="titleArea">

        <h1 class="titleEnglish">
            emotional
        </h1>

        <h2 class="titleJapanese">
            ― 時の瞬き ―
        </h2>

    </div>

    <div class="concept">

        <p>あの頃みた雲は、<br>触れそうな気がした。</p>

        <p>
            時は流れても、<br>
            記憶は色褪せず胸の奥に生きている。
        </p>

        <p>
            この一瞬が、<br>
            あなたの記憶と未来を<br>
            優しく繋ぎますように。
        </p>

    </div>

    <button id="startButton">
        Touch to Begin
    </button>

    <div class="bottomBar">

        <button id="bgmButton">
            ♪ BGM ON
        </button>

        <button id="infoButton">
            Information
        </button>

    </div>

</div>

<div id="infoPanel">

    <div class="infoContent">

        <h3>Information</h3>

        <p>
            本作品は光の演出を含みます。<br>
            光刺激に敏感な方や、光過敏性てんかんの既往歴がある方は、
            体調に配慮しながらご鑑賞ください。
        </p>

        <p>
            BGMはON/OFFを切り替えられます。
        </p>

        <p>
            本作品はスマートフォンでの鑑賞に最適化しています。<br>
            PC環境ではブラウザやGPU性能により、
            一部演出の見え方が異なる場合があります。
        </p>

        <button id="closeInfo">
            Close
        </button>

    </div>

</div>

<!--
<script type="module" src="./openingUI.js"></script>
-->

</body>
</html>
